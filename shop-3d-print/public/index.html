<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stampe 3D — Negozio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Le Mie Stampe 3D</h1>
    <button id="cart-toggle">🛒 Carrello (<span id="cart-count">0</span>)</button>
  </header>

  <main class="grid" id="product-grid">
    <!-- Prodotti generati da app.js -->
  </main>

  <aside id="cart-drawer" class="cart-drawer hidden">
    <div class="cart-header">
      <h2>Il tuo carrello</h2>
      <button id="cart-close">✕</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <p>Totale: <strong id="cart-total">€0.00</strong></p>
      <button id="checkout-btn">Vai al pagamento</button>
      <p id="checkout-error" class="error"></p>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
